<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planning Poker</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      const initialParams = new URLSearchParams(window.location.search);
      document.documentElement.dataset.view =
        initialParams.get("view") === "public"
          ? "public"
          : "controller";
      document.documentElement.dataset.mode = initialParams.get("room") ? "shared" : "single";
    </script>
    <script src="./supabase-config.js"></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #18202b;
        --muted: #697386;
        --line: #d7dee8;
        --surface: #ffffff;
        --surface-soft: #f5f7fa;
        --accent: #0f766e;
        --accent-dark: #115e59;
        --accent-soft: #d9f3ef;
        --shadow: 0 22px 70px rgba(25, 32, 43, 0.15);
        --card-radius: 8px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          linear-gradient(rgba(15, 118, 110, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(15, 118, 110, 0.05) 1px, transparent 1px),
          linear-gradient(135deg, #f9fafb 0%, #eef3f7 100%);
        background-size: 34px 34px, 34px 34px, auto;
        color: var(--ink);
      }

      button {
        font: inherit;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: clamp(14px, 2vw, 22px);
        padding: clamp(14px, 3vw, 34px);
      }

      .topbar,
      .controls,
      .shared-panel {
        width: min(100%, 1040px);
        margin-inline: auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 8px 28px rgba(24, 32, 43, 0.08);
        color: var(--accent);
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.1rem, 2.8vw, 1.55rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      .state-pill {
        flex: 0 0 auto;
        min-width: 88px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 700;
        text-align: center;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .room-pill {
        display: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 700;
      }

      html[data-mode="shared"] .room-pill {
        display: block;
      }

      .stage {
        width: min(100%, 1040px);
        margin-inline: auto;
        display: grid;
        place-items: center;
        min-height: 0;
      }

      .display-card {
        display: block;
        position: relative;
        width: min(76vw, 390px);
        aspect-ratio: 5 / 7;
        border: 0;
        border-radius: var(--card-radius);
        background: transparent;
        padding: 0;
        perspective: 1300px;
        cursor: pointer;
      }

      .display-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border: 3px dotted rgba(82, 94, 109, 0.46);
        border-radius: var(--card-radius);
        opacity: 1;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .display-card.has-visual-card::before {
        opacity: 0;
      }

      .display-card:disabled {
        cursor: default;
      }

      .display-card:focus-visible,
      .choice-card:focus-visible,
      .action:focus-visible {
        outline: 4px solid rgba(15, 118, 110, 0.24);
        outline-offset: 4px;
      }

      .card-shell,
      .card-inner {
        display: block;
        position: relative;
        width: 100%;
        height: 100%;
      }

      .card-shell {
        opacity: 0;
        transform-origin: 50% 100%;
        visibility: hidden;
        will-change: transform, opacity;
      }

      .display-card.has-visual-card .card-shell {
        opacity: 1;
        visibility: visible;
      }

      .display-card.is-entering .card-shell {
        animation: cardSlideIn 360ms cubic-bezier(0.18, 0.84, 0.22, 1);
      }

      .display-card.is-exiting .card-shell {
        animation: cardSlideOut 300ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      @keyframes cardSlideIn {
        from {
          opacity: 0;
          transform: translateY(42%) scale(0.94);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes cardSlideOut {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }

        to {
          opacity: 0;
          transform: translateY(46%) scale(0.96);
        }
      }

      .card-inner {
        transform-style: preserve-3d;
        transition: transform 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .display-card.is-revealed .card-inner {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: var(--card-radius);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        box-shadow: var(--shadow);
      }

      .card-back {
        border: 1px solid #c9d3df;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.5), transparent 42%),
          repeating-linear-gradient(
            45deg,
            #0f766e 0 13px,
            #12867d 13px 26px,
            #0d625c 26px 39px
          );
      }

      .display-card.has-visual-card:not(.is-revealed) .card-back {
        border-color: #b7fff4;
        box-shadow:
          var(--shadow),
          0 0 0 7px rgba(15, 118, 110, 0.14);
      }

      .card-back::before {
        content: "";
        width: 72%;
        height: 72%;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 4px;
        background:
          radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.5) 0 6px, transparent 7px),
          radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.42) 0 6px, transparent 7px),
          rgba(255, 255, 255, 0.12);
      }

      .card-front {
        transform: rotateY(180deg);
        border: 1px solid #cfd8e3;
        background:
          linear-gradient(180deg, rgba(15, 118, 110, 0.08), transparent 42%),
          var(--surface);
      }

      .card-value {
        display: grid;
        place-items: center;
        width: 82%;
        height: 82%;
        border: 2px solid var(--accent);
        border-radius: 4px;
        color: var(--accent-dark);
        font-size: clamp(6.5rem, 24vw, 12.5rem);
        font-weight: 900;
        line-height: 0.82;
        letter-spacing: 0;
      }

      .card-value.is-infinite {
        font-size: clamp(7rem, 26vw, 14rem);
        padding-bottom: 0.12em;
      }

      .placeholder {
        display: grid;
        place-items: center;
        gap: 10px;
        width: 82%;
        height: 82%;
        border: 2px dashed rgba(255, 255, 255, 0.78);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: clamp(3rem, 12vw, 5.5rem);
        font-weight: 900;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.24);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
      }

      .deck {
        display: grid;
        grid-template-columns: repeat(6, minmax(46px, 1fr));
        gap: 8px;
      }

      .choice-card {
        min-width: 0;
        aspect-ratio: 5 / 6;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        color: var(--ink);
        cursor: pointer;
        font-size: clamp(1.08rem, 3vw, 1.7rem);
        font-weight: 850;
        box-shadow: 0 8px 24px rgba(24, 32, 43, 0.08);
        transition:
          transform 140ms ease,
          border-color 140ms ease,
          background 140ms ease,
          box-shadow 140ms ease;
      }

      .choice-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(24, 32, 43, 0.12);
      }

      .choice-card[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent-dark);
        box-shadow: 0 10px 30px rgba(15, 118, 110, 0.2);
      }

      .actions {
        display: flex;
        align-items: stretch;
        gap: 8px;
      }

      .action {
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: 48px;
        padding: 0 18px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-weight: 800;
        white-space: nowrap;
      }

      .action.primary {
        min-width: 108px;
        border-color: var(--accent);
        background: var(--accent);
        color: #ffffff;
      }

      .action.primary:hover {
        background: var(--accent-dark);
      }

      .action.secondary:hover {
        border-color: #b7c2d0;
        background: var(--surface-soft);
      }

      .action.is-ready {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent-dark);
      }

      .action:disabled {
        cursor: not-allowed;
        opacity: 0.46;
      }

      .shared-panel {
        display: none;
        min-height: 0;
      }

      html[data-mode="shared"] .stage {
        display: none;
      }

      html[data-mode="shared"] .shared-panel {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 14px;
      }

      .room-toolbar {
        display: grid;
        grid-template-columns: 1fr minmax(180px, 260px) auto;
        gap: 10px;
        align-items: end;
      }

      .room-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #94a3b8;
      }

      .status-dot.is-online {
        background: var(--accent);
      }

      .room-name {
        min-width: 0;
        font-weight: 850;
        color: var(--ink);
      }

      .connection-label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .name-field {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .name-field input {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 11px;
        background: rgba(255, 255, 255, 0.88);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
      }

      .name-field input:focus-visible {
        outline: 4px solid rgba(15, 118, 110, 0.18);
        outline-offset: 2px;
      }

      .shared-table {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 220px));
        gap: 12px;
        align-content: start;
        justify-content: center;
        min-height: 0;
      }

      .participant {
        min-width: 0;
        display: grid;
        gap: 9px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 10px 28px rgba(24, 32, 43, 0.08);
      }

      .participant-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }

      .participant-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink);
        font-weight: 850;
      }

      .participant-badges {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 auto;
      }

      .you-badge,
      .ready-badge {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 7px;
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 0.74rem;
        font-weight: 850;
      }

      .you-badge {
        border-color: rgba(24, 32, 43, 0.12);
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
      }

      .ready-badge.is-ready {
        border-color: rgba(15, 118, 110, 0.28);
        color: var(--accent-dark);
        background: var(--accent-soft);
      }

      .participant-card {
        position: relative;
        width: 100%;
        aspect-ratio: 5 / 7;
        border: 3px dotted rgba(82, 94, 109, 0.36);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.38);
      }

      .participant-card.is-hidden,
      .participant-card.is-revealed {
        border: 1px solid #b7fff4;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.5), transparent 42%),
          repeating-linear-gradient(
            45deg,
            #0f766e 0 11px,
            #12867d 11px 22px,
            #0d625c 22px 33px
          );
        box-shadow: 0 8px 24px rgba(15, 118, 110, 0.14);
      }

      .participant-card.is-revealed {
        display: grid;
        place-items: center;
        border-color: #cfd8e3;
        background:
          linear-gradient(180deg, rgba(15, 118, 110, 0.08), transparent 42%),
          var(--surface);
      }

      .participant-card.is-hidden::before {
        content: "?";
        position: absolute;
        inset: 18%;
        display: grid;
        place-items: center;
        border: 2px dashed rgba(255, 255, 255, 0.78);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: clamp(2.2rem, 8vw, 4.2rem);
        font-weight: 900;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.24);
      }

      .participant-value {
        display: grid;
        place-items: center;
        width: 80%;
        height: 80%;
        border: 2px solid var(--accent);
        border-radius: 4px;
        color: var(--accent-dark);
        font-size: clamp(3.4rem, 10vw, 6rem);
        font-weight: 900;
        line-height: 0.82;
      }

      .participant-value.is-infinite {
        font-size: clamp(3.8rem, 11vw, 6.8rem);
        padding-bottom: 0.1em;
      }

      .shared-notice {
        min-height: 1.25em;
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      html[data-view="public"] .app {
        grid-template-rows: 1fr;
        padding: clamp(18px, 4vw, 48px);
      }

      html[data-view="public"] .topbar,
      html[data-view="public"] .controls {
        display: none;
      }

      html[data-view="public"] .stage {
        height: calc(100vh - clamp(36px, 8vw, 96px));
      }

      html[data-view="public"] .display-card {
        width: min(78vw, 560px, calc(88vh * 5 / 7));
        cursor: default;
      }

      html[data-view="public"][data-mode="shared"] .app {
        grid-template-rows: 1fr;
      }

      html[data-view="public"][data-mode="shared"] .stage {
        display: none;
      }

      html[data-view="public"][data-mode="shared"] .shared-panel {
        display: grid;
        width: min(100%, 1180px);
        height: calc(100vh - clamp(36px, 8vw, 96px));
        align-content: center;
      }

      html[data-view="public"][data-mode="shared"] .room-toolbar,
      html[data-view="public"][data-mode="shared"] .shared-notice {
        display: none;
      }

      html[data-view="public"][data-mode="shared"] .shared-table {
        align-content: center;
      }

      @media (max-width: 760px) {
        .app {
          min-height: 100svh;
          padding: 12px;
        }

        .topbar {
          align-items: flex-start;
        }

        .brand-mark {
          width: 38px;
          height: 38px;
          border-radius: 8px;
        }

        .stage {
          align-items: center;
        }

        .display-card {
          width: min(82vw, 320px);
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .room-toolbar {
          grid-template-columns: 1fr;
          align-items: stretch;
        }

        .actions {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
        }

        .action {
          width: 100%;
          min-width: 0;
          padding-inline: 10px;
        }
      }

      @media (max-width: 420px) {
        .deck {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .choice-card {
          aspect-ratio: 8 / 5;
        }

        .state-pill {
          min-width: 76px;
          padding-inline: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand" aria-label="Planning Poker">
          <div class="brand-mark" aria-hidden="true">P</div>
          <h1>Planning Poker</h1>
        </div>
        <div class="top-actions">
          <div class="room-pill" id="roomPill">Room</div>
          <div class="state-pill" id="stateLabel" aria-live="polite">No card</div>
        </div>
      </header>

      <section class="stage" aria-label="Selected card">
        <button class="display-card" id="displayCard" type="button" disabled>
          <span class="card-shell">
            <span class="card-inner">
              <span class="card-face card-back" aria-hidden="true">
                <span class="placeholder" id="hiddenMarker">?</span>
              </span>
              <span class="card-face card-front">
                <span class="card-value" id="cardValue">?</span>
              </span>
            </span>
          </span>
        </button>
      </section>

      <section class="shared-panel" id="sharedPanel" aria-label="Shared planning table">
        <div class="room-toolbar">
          <div class="room-meta">
            <span class="status-dot" id="connectionDot" aria-hidden="true"></span>
            <span class="room-name" id="roomName">Room</span>
            <span class="connection-label" id="connectionLabel">Local</span>
          </div>
          <label class="name-field">
            Name
            <input id="participantNameInput" type="text" maxlength="32" autocomplete="name" />
          </label>
          <button class="action secondary" id="copyRoomButton" type="button">Copy Link</button>
        </div>
        <div class="shared-table" id="sharedTable"></div>
        <p class="shared-notice" id="sharedNotice" aria-live="polite"></p>
      </section>

      <section class="controls" aria-label="Card controls">
        <div class="deck" id="deck" aria-label="Card values"></div>
        <div class="actions">
          <button class="action secondary" id="readyButton" type="button">Ready</button>
          <button class="action primary" id="revealButton" type="button" disabled>Reveal</button>
          <button class="action secondary" id="clearButton" type="button" disabled>Clear</button>
          <button class="action secondary" id="displayButton" type="button">Display</button>
          <button class="action secondary" id="roomButton" type="button">Room</button>
        </div>
      </section>
    </main>

    <script>
      const cards = [
        { value: "1", label: "1" },
        { value: "3", label: "3" },
        { value: "5", label: "5" },
        { value: "8", label: "8" },
        { value: "13", label: "13" },
        { value: "infinite", label: "∞" },
      ];

      const params = new URLSearchParams(window.location.search);
      const rawRoomId = params.get("room") ?? "";
      const roomId = normalizeRoomId(rawRoomId);
      const isPublicView = document.documentElement.dataset.view === "public";
      const isSharedMode = Boolean(roomId);
      const canTrackPresence = isSharedMode && !isPublicView;
      const supabaseConfig = window.PLANNING_CARDS_SUPABASE ?? {};
      const supabaseClientUrl = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
      const participantIdKey = "planning-poker-participant-id";
      const participantNameKey = "planning-poker-participant-name";
      const participantId = getOrCreateParticipantId();
      const storageKey = isSharedMode
        ? `planning-poker-card-state:${roomId}`
        : "planning-poker-card-state";
      const channelName = isSharedMode
        ? `planning-poker-cards:${roomId}`
        : "planning-poker-cards";
      const localChannel =
        "BroadcastChannel" in window ? new BroadcastChannel(channelName) : null;
      const slideOutMs = 320;
      const slideInMs = 380;

      const deck = document.querySelector("#deck");
      const displayCard = document.querySelector("#displayCard");
      const cardValue = document.querySelector("#cardValue");
      const hiddenMarker = document.querySelector("#hiddenMarker");
      const readyButton = document.querySelector("#readyButton");
      const revealButton = document.querySelector("#revealButton");
      const clearButton = document.querySelector("#clearButton");
      const displayButton = document.querySelector("#displayButton");
      const roomButton = document.querySelector("#roomButton");
      const stateLabel = document.querySelector("#stateLabel");
      const roomPill = document.querySelector("#roomPill");
      const roomName = document.querySelector("#roomName");
      const connectionDot = document.querySelector("#connectionDot");
      const connectionLabel = document.querySelector("#connectionLabel");
      const participantNameInput = document.querySelector("#participantNameInput");
      const copyRoomButton = document.querySelector("#copyRoomButton");
      const sharedTable = document.querySelector("#sharedTable");
      const sharedNotice = document.querySelector("#sharedNotice");

      let state = loadState();
      let participantName = getParticipantName();
      let visualSelectedValue = state.selectedValue;
      let visualRevealed = Boolean(state.selectedValue && state.revealed);
      let hasRendered = false;
      let enterTimer = null;
      let exitTimer = null;
      let sharedPhase = state.revealed ? "revealed" : "voting";
      let supabase = null;
      let roomChannel = null;
      let presenceReady = false;
      let presenceRows = [];
      let presenceTimer = null;

      function normalizeRoomId(value) {
        return value.toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40);
      }

      function createRoomId() {
        const alphabet = "abcdefghjkmnpqrstuvwxyz23456789";
        const bytes = new Uint8Array(8);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (byte) => alphabet[byte % alphabet.length]).join("");
      }

      function getOrCreateParticipantId() {
        const existing = localStorage.getItem(participantIdKey);
        if (existing) return existing;

        const nextId = crypto.randomUUID?.() ?? `${Date.now()}-${Math.random()}`;
        localStorage.setItem(participantIdKey, nextId);
        return nextId;
      }

      function getParticipantName() {
        const savedName = localStorage.getItem(participantNameKey);
        if (savedName) return savedName;

        const suffix = participantId.replace(/[^a-z0-9]/gi, "").slice(0, 4).toUpperCase();
        return `Guest ${suffix}`;
      }

      function selectedCard() {
        return cards.find((card) => card.value === state.selectedValue) ?? null;
      }

      function visualCard() {
        return cards.find((card) => card.value === visualSelectedValue) ?? null;
      }

      function cardLabel(value) {
        return cards.find((card) => card.value === value)?.label ?? "?";
      }

      function normalizeState(value) {
        const selected = cards.find((card) => card.value === value?.selectedValue);
        const updatedAt =
          Number.isFinite(value?.updatedAt) && value.updatedAt > 0 ? value.updatedAt : Date.now();

        return {
          selectedValue: selected?.value ?? null,
          revealed: Boolean(selected && value?.revealed),
          ready: Boolean(value?.ready),
          updatedAt,
        };
      }

      function loadState() {
        try {
          return normalizeState(JSON.parse(localStorage.getItem(storageKey) ?? "{}"));
        } catch {
          return normalizeState({});
        }
      }

      function restartClassAnimation(className, duration, timerName) {
        displayCard.classList.remove(className);
        void displayCard.offsetWidth;
        displayCard.classList.add(className);

        if (timerName === "enter") {
          clearTimeout(enterTimer);
          enterTimer = setTimeout(() => displayCard.classList.remove(className), duration);
          return;
        }

        clearTimeout(exitTimer);
        exitTimer = setTimeout(() => {
          visualSelectedValue = null;
          visualRevealed = false;
          displayCard.classList.remove(className);
          render();
        }, duration);
      }

      function publishState({ syncPresence = true } = {}) {
        state.updatedAt = Date.now();

        try {
          localStorage.setItem(storageKey, JSON.stringify(state));
        } catch {
          // BroadcastChannel still keeps open tabs connected when local persistence is unavailable.
        }

        localChannel?.postMessage(state);
        render();

        if (syncPresence) {
          schedulePresenceSync();
        }
      }

      function applyRemoteState(nextState) {
        const normalized = normalizeState(nextState);

        if (normalized.updatedAt < state.updatedAt) {
          return;
        }

        state = normalized;
        if (isSharedMode) {
          sharedPhase = state.revealed ? "revealed" : sharedPhase;
        }
        render();
      }

      function setSelection(card) {
        state = {
          ...state,
          selectedValue: card.value,
          revealed: isSharedMode ? sharedPhase === "revealed" : false,
        };
        publishState();
      }

      function toggleReady() {
        state = {
          ...state,
          ready: !state.ready,
        };
        publishState();
      }

      function toggleReveal() {
        if (isSharedMode) {
          setSharedPhase(sharedPhase === "revealed" ? "voting" : "revealed", true);
          return;
        }

        if (!selectedCard()) return;
        state = {
          ...state,
          revealed: !state.revealed,
        };
        publishState();
      }

      function clearSelection() {
        if (isSharedMode) {
          if (roomChannel) {
            roomChannel.send({
              type: "broadcast",
              event: "room",
              payload: { type: "reset", at: Date.now() },
            });
          }
          sharedPhase = "voting";
          state = {
            ...state,
            selectedValue: null,
            revealed: false,
            ready: false,
          };
          publishState();
          return;
        }

        state = {
          selectedValue: null,
          revealed: false,
          ready: false,
          updatedAt: state.updatedAt,
        };
        publishState();
      }

      function setSharedPhase(nextPhase, broadcast) {
        sharedPhase = nextPhase;
        state = {
          ...state,
          revealed: nextPhase === "revealed" && Boolean(state.selectedValue),
        };

        if (broadcast && roomChannel) {
          roomChannel.send({
            type: "broadcast",
            event: "room",
            payload: { type: nextPhase === "revealed" ? "reveal" : "hide", at: Date.now() },
          });
        }

        publishState();
      }

      function applyRoomEvent(payload) {
        if (payload?.type === "reveal") {
          setSharedPhase("revealed", false);
          return;
        }

        if (payload?.type === "hide") {
          setSharedPhase("voting", false);
          return;
        }

        if (payload?.type === "reset") {
          sharedPhase = "voting";
          state = {
            ...state,
            selectedValue: null,
            revealed: false,
            ready: false,
          };
          publishState();
        }
      }

      function currentPresencePayload() {
        const hasSelection = Boolean(state.selectedValue);
        const revealed = sharedPhase === "revealed" && hasSelection;

        return {
          id: participantId,
          name: participantName,
          ready: state.ready,
          hasSelection,
          revealed,
          selectedValue: revealed ? state.selectedValue : null,
          updatedAt: Date.now(),
        };
      }

      function schedulePresenceSync() {
        if (!canTrackPresence || !presenceReady || !roomChannel) {
          return;
        }

        clearTimeout(presenceTimer);
        presenceTimer = setTimeout(() => {
          roomChannel.track(currentPresencePayload());
        }, 80);
      }

      function localParticipantRow() {
        return {
          ...currentPresencePayload(),
          isSelf: true,
        };
      }

      function participantRows() {
        const byId = new Map();

        presenceRows.forEach((participant) => {
          const previous = byId.get(participant.id);
          if (!previous || participant.updatedAt >= previous.updatedAt) {
            byId.set(participant.id, participant);
          }
        });

        const local = localParticipantRow();
        const existingLocal = byId.get(local.id);
        if (!existingLocal || canTrackPresence) {
          byId.set(local.id, { ...existingLocal, ...local });
        }

        return [...byId.values()].sort((a, b) => {
          if (a.id === participantId) return -1;
          if (b.id === participantId) return 1;
          return a.name.localeCompare(b.name);
        });
      }

      function updatePresenceRows() {
        if (!roomChannel) return;

        presenceRows = Object.values(roomChannel.presenceState())
          .flat()
          .map((payload) => ({
            id: payload.id,
            name: payload.name || "Guest",
            ready: Boolean(payload.ready),
            hasSelection: Boolean(payload.hasSelection),
            revealed: Boolean(payload.revealed),
            selectedValue: payload.selectedValue ?? null,
            updatedAt: Number(payload.updatedAt) || 0,
          }))
          .filter((participant) => participant.id);

        if (presenceRows.some((participant) => participant.revealed)) {
          sharedPhase = "revealed";
        }

        render();
      }

      async function initSharedMode() {
        if (!isSharedMode) return;

        roomPill.textContent = roomId;
        roomName.textContent = `Room ${roomId}`;
        participantNameInput.value = participantName;
        render();

        if (!supabaseConfig.url || !supabaseConfig.anonKey) {
          connectionLabel.textContent = "Config missing";
          sharedNotice.textContent = "Add supabase-config.js values to sync this room.";
          return;
        }

        connectionLabel.textContent = "Connecting";

        try {
          const { createClient } = await import(supabaseClientUrl);
          supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          roomChannel = supabase.channel(`planning-cards:${roomId}`, {
            config: {
              broadcast: { self: false },
              presence: { key: participantId },
            },
          });

          roomChannel
            .on("presence", { event: "sync" }, updatePresenceRows)
            .on("presence", { event: "join" }, updatePresenceRows)
            .on("presence", { event: "leave" }, updatePresenceRows)
            .on("broadcast", { event: "room" }, ({ payload }) => applyRoomEvent(payload))
            .subscribe((status) => {
              connectionLabel.textContent =
                status === "SUBSCRIBED" ? "Online" : status.toLowerCase();
              connectionDot.classList.toggle("is-online", status === "SUBSCRIBED");

              if (status === "SUBSCRIBED") {
                presenceReady = true;
                schedulePresenceSync();
                sharedNotice.textContent = "";
              }
            });
        } catch (error) {
          connectionLabel.textContent = "Offline";
          sharedNotice.textContent = "Realtime connection failed.";
          console.error(error);
        }
      }

      function renderPersonalCard() {
        const selected = selectedCard();
        const hasSelection = Boolean(selected);
        const hadVisualCard = Boolean(visualSelectedValue);

        if (selected) {
          clearTimeout(exitTimer);
          displayCard.classList.remove("is-exiting");

          visualSelectedValue = selected.value;
          visualRevealed = isSharedMode ? sharedPhase === "revealed" : state.revealed;

          if (hasRendered && !hadVisualCard) {
            restartClassAnimation("is-entering", slideInMs, "enter");
          }
        } else if (visualSelectedValue && hasRendered) {
          if (!displayCard.classList.contains("is-exiting")) {
            displayCard.classList.remove("is-entering");
            clearTimeout(enterTimer);
            restartClassAnimation("is-exiting", slideOutMs, "exit");
          }
        } else {
          visualSelectedValue = null;
          visualRevealed = false;
        }

        const visual = visualCard();
        const hasVisualCard = Boolean(visual);

        displayCard.disabled = !isPublicView && !hasSelection;
        displayCard.tabIndex = isPublicView ? -1 : 0;
        displayCard.setAttribute("aria-disabled", String(isPublicView || !hasSelection));
        displayCard.classList.toggle("is-revealed", hasVisualCard && visualRevealed);
        displayCard.classList.toggle("has-selection", hasSelection);
        displayCard.classList.toggle("has-visual-card", hasVisualCard);
        cardValue.textContent = visual?.label ?? "?";
        cardValue.classList.toggle("is-infinite", visual?.value === "infinite");
        hiddenMarker.textContent = "?";
        displayCard.setAttribute(
          "aria-label",
          visualRevealed && visual
            ? `Revealed card ${visual.value}`
            : selected
              ? "Hidden card placed"
              : "No card selected"
        );
      }

      function renderSharedTable() {
        if (!isSharedMode) return;

        const rows = participantRows();
        sharedTable.replaceChildren(
          ...rows.map((participant) => {
            const item = document.createElement("article");
            item.className = "participant";

            const head = document.createElement("div");
            head.className = "participant-head";

            const name = document.createElement("div");
            name.className = "participant-name";
            name.textContent = participant.name;

            const badges = document.createElement("div");
            badges.className = "participant-badges";

            if (participant.isSelf) {
              const you = document.createElement("div");
              you.className = "you-badge";
              you.textContent = "You";
              badges.append(you);
            }

            const ready = document.createElement("div");
            ready.className = `ready-badge${participant.ready ? " is-ready" : ""}`;
            ready.textContent = participant.ready ? "Ready" : "Waiting";
            badges.append(ready);

            const card = document.createElement("div");
            card.className = "participant-card";

            if (participant.revealed && participant.selectedValue) {
              card.classList.add("is-revealed");
              const value = document.createElement("div");
              value.className = `participant-value${
                participant.selectedValue === "infinite" ? " is-infinite" : ""
              }`;
              value.textContent = cardLabel(participant.selectedValue);
              card.append(value);
            } else if (participant.hasSelection) {
              card.classList.add("is-hidden");
            }

            head.append(name, badges);
            item.append(head, card);
            return item;
          })
        );
      }

      function renderControls() {
        const hasSelection = Boolean(selectedCard());

        deck.querySelectorAll(".choice-card").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.value === state.selectedValue));
        });

        readyButton.textContent = state.ready ? "Not Ready" : "Ready";
        readyButton.classList.toggle("is-ready", state.ready);
        revealButton.disabled = isSharedMode ? false : !hasSelection;
        clearButton.disabled = isSharedMode ? false : !hasSelection;
        revealButton.textContent = isSharedMode
          ? sharedPhase === "revealed"
            ? "Hide All"
            : "Reveal All"
          : state.revealed
            ? "Hide"
            : "Reveal";
        clearButton.textContent = isSharedMode ? "Reset" : "Clear";
        stateLabel.textContent = state.revealed
          ? "Revealed"
          : state.ready
            ? "Ready"
            : hasSelection
              ? "Placed"
              : "No card";
      }

      function render() {
        renderPersonalCard();
        renderControls();
        renderSharedTable();
        hasRendered = true;
      }

      cards.forEach((card) => {
        const button = document.createElement("button");
        button.className = "choice-card";
        button.type = "button";
        button.dataset.value = card.value;
        button.textContent = card.label;
        button.setAttribute("aria-label", `Select ${card.value}`);
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", () => setSelection(card));
        deck.append(button);
      });

      readyButton.addEventListener("click", toggleReady);

      revealButton.addEventListener("click", () => {
        toggleReveal();
      });

      clearButton.addEventListener("click", () => {
        clearSelection();
      });

      displayButton.addEventListener("click", () => {
        const displayUrl = new URL(window.location.href);
        displayUrl.searchParams.set("view", "public");
        window.open(displayUrl.toString(), "planning-poker-display");
      });

      roomButton.addEventListener("click", () => {
        const roomUrl = new URL(window.location.href);
        roomUrl.searchParams.set("room", roomId || createRoomId());
        roomUrl.searchParams.delete("view");
        window.location.href = roomUrl.toString();
      });

      copyRoomButton.addEventListener("click", async () => {
        const roomUrl = new URL(window.location.href);
        roomUrl.searchParams.set("room", roomId || createRoomId());
        roomUrl.searchParams.delete("view");

        try {
          await navigator.clipboard.writeText(roomUrl.toString());
          copyRoomButton.textContent = "Copied";
          setTimeout(() => {
            copyRoomButton.textContent = "Copy Link";
          }, 1200);
        } catch {
          window.prompt("Room link", roomUrl.toString());
        }
      });

      participantNameInput.addEventListener("input", () => {
        participantName = participantNameInput.value.trim() || "Guest";
        localStorage.setItem(participantNameKey, participantName);
        schedulePresenceSync();
        render();
      });

      displayCard.addEventListener("click", () => {
        if (isPublicView) return;
        toggleReveal();
      });

      window.addEventListener("keydown", (event) => {
        if (isPublicView) {
          return;
        }

        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) {
          return;
        }

        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleReveal();
          return;
        }

        if (event.key === "Escape") {
          clearSelection();
          return;
        }

        const byKey = {
          "1": cards[0],
          "3": cards[1],
          "5": cards[2],
          "8": cards[3],
        };

        if (byKey[event.key]) {
          setSelection(byKey[event.key]);
        }
      });

      localChannel?.addEventListener("message", (event) => {
        applyRemoteState(event.data);
      });

      window.addEventListener("storage", (event) => {
        if (event.key === storageKey && event.newValue) {
          applyRemoteState(JSON.parse(event.newValue));
        }
      });

      render();
      initSharedMode();
    </script>
  </body>
</html>
